<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-labelledby="t d">
<title id="t">Uttar Pradesh: Rampur single malt</title>
<desc id="d">Heavy tumbler of neat Rampur Indian single malt with a square of silver leaf on the surface and a kewra jal spritz in the air; malted barley and a kewra spray bottle beside it, a faint copper pot still behind.</desc>
